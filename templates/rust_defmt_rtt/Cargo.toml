[package]
name = "@NAME@"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# defmt over SEGGER RTT (defmt-rtt), no HAL: runs on any Cortex-M4F board and in segger-box's cmsim.
[dependencies]
defmt = "1.2.0"
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"

[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
codegen-units = 1
